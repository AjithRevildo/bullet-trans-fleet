version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: bullet-trans-api
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/bullet_trans_fleet
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_me
      JWT_REFRESH_SECRET: change_me_refresh
      GPS_MODE: mock
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app
      - /app/node_modules

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: bullet-trans-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api/v1
      VITE_APP_NAME: Bullet Trans Fleet Command Center
    depends_on:
      - api
    volumes:
      - .:/app
      - /app/node_modules

  mongodb:
    image: mongo:7
    container_name: bullet-trans-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bullet_trans_fleet
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: bullet-trans-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:
